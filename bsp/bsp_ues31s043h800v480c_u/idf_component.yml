version: "1.0.2"
description: Board Support Package (BSP) for UES31S043H800V480C-U (ESP32-S31 4.3-inch 800x480)
url: https://github.com/VIEWESMART/Viewe-esp32-components/tree/main/bsp/bsp_ues31s043h800v480c_u
repository: https://github.com/VIEWESMART/Viewe-esp32-components.git
repository_info:
  path: bsp/bsp_ues31s043h800v480c_u
documentation: https://github.com/VIEWESMART/Viewe-esp32-components/blob/main/bsp/bsp_ues31s043h800v480c_u/README.md
issues: https://github.com/VIEWESMART/Viewe-esp32-components/issues
license: Apache-2.0
targets:
  - esp32s31
tags:
  - bsp

# Local generator and the verify apps under ../bsp_verify stay out of the
# registry archive. Those apps are not self-contained examples.
files:
  exclude:
    - "_gen_verify.py"
    - "dist/**"
    - "**/.git/**"
    - "**/build/**"
    - "**/.cache/**"
    - "**/.cursor/**"
    - "**/.vscode/**"
    - "**/.clangd"

# Every dependency is downloaded by the IDF Component Manager into the
# application's managed_components directory. Do not vendor them in this tree.
dependencies:
  idf: ">=5.5.0"
  espressif/esp_lcd_touch_gt911:
    version: "^1"
    public: true
  espressif/esp_codec_dev:
    version: "~1.5"
    public: true
  espressif/led_strip:
    version: "^3"
    public: true
  # 4.2.1 adds targets that do not define SOC_ADC_CHANNEL_NUM (ESP32-S31).
  espressif/button:
    version: ">=4.2.1"
    public: true
  espressif/esp_lvgl_port:
    version: "~2.9"
    public: true
    rules:
      - if: $CONFIG{BSP_NO_GRAPHIC_LIB} != True
  lvgl/lvgl:
    version: ">=8,<10"
    public: true
    rules:
      - if: $CONFIG{BSP_NO_GRAPHIC_LIB} != True
