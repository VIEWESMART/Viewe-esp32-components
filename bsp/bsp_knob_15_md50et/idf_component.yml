version: "1.0.0"
description: "BSP for UEDX46460015-MD50E 1.5\" round AMOLED knob (CO5300 QSPI, CST820, LVGL 8/9, encoder, button)"
license: "Apache-2.0"
targets:
  - esp32s3
tags:
  - bsp
  - display
  - lvgl
  - amoled
  - qspi
  - touch
  - knob
dependencies:
  idf: ">=5.5"
  espressif/esp_lcd_co5300: "^2.1.0"
  espressif/esp_lvgl_adapter: "*"
  viewesmart/esp_lcd_touch_cst820: "^1.0.3"
  # App selects LVGL major (^8 or ^9) in its own idf_component.yml
  lvgl/lvgl:
    version: ">=8,<10"
    public: true
  espressif/knob:
    version: "^1.0.0"
    public: true
  espressif/button:
    version: "^3.3.1"
    public: true
